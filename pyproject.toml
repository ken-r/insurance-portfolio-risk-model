[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-portfolio-risk-model"
version = "0.1.0"
description = "Risk model for a multi-line insurance portfolio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "jupyterlab>=4",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["insurance_risk*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
